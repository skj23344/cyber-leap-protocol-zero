<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>赛博跃迁：零号协议 // Cyber Leap: Protocol Zero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #07060f;
            color: #00f0ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #140d28 0%, #05040a 100%);
        }
        canvas {
            display: block;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.45), inset 0 0 20px rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            image-rendering: auto;
        }
        /* Mobile Touch Controls */
        #touch-controls {
            display: none;
            position: absolute;
            bottom: 24px;
            left: 20px;
            right: 20px;
            justify-content: space-between;
            pointer-events: auto;
        }
        @media (max-width: 900px), (pointer: coarse) {
            #touch-controls { display: flex; }
        }
        .touch-btn {
            background: rgba(0, 240, 255, 0.2);
            border: 2px solid #00f0ff;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(0, 240, 255, 0.6);
            transform: scale(0.92);
        }
        #touch-dpad { display: flex; gap: 16px; }
        #touch-actions { display: flex; gap: 14px; }
        #audio-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(12, 10, 26, 0.85);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            font-family: monospace;
            font-size: 13px;
            box-shadow: 0 0 10px rgba(0,240,255,0.3);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <button id="audio-btn" onclick="toggleAudio()">🔊 音效/BGM: 开</button>

    <div id="touch-controls">
        <div id="touch-dpad">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div id="touch-actions">
            <div class="touch-btn" id="btn-attack" style="border-color:#ff0055; background:rgba(255,0,85,0.35)">⚔️</div>
            <div class="touch-btn" id="btn-dash" style="border-color:#00f0ff">⚡</div>
            <div class="touch-btn" id="btn-jump" style="border-color:#39ff14; background:rgba(57,255,20,0.35)">▲</div>
        </div>
    </div>
</div>

<script>
/**
 * CYBER LEAP: PROTOCOL ZERO - V2.0 ULTRA RESOLUTION ENGINE
 * Fixed tunneling/clipping, enhanced physics, multi-frame animations & neon bloom.
 */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Sound System
let audioContext = null;
let audioEnabled = true;
const soundUrls = {
    jump: "assets/audio/jump.wav",
    dash: "assets/audio/dash.wav",
    slash: "assets/audio/slash.wav",
    shoot: "assets/audio/shoot.wav",
    parry: "assets/audio/parry.wav",
    collect: "assets/audio/collect.wav",
    stomp: "assets/audio/stomp.wav",
    hit: "assets/audio/hit.wav",
    portal: "assets/audio/portal.wav",
    bgm: "assets/audio/bgm.wav",
    weapon_pickup: "assets/audio/weapon_pickup.wav"
};

const bgmAudio = new Audio(soundUrls.bgm);
bgmAudio.loop = true;
bgmAudio.volume = 0.45;

function initAudio() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === "suspended") audioContext.resume();
    if (audioEnabled && bgmAudio.paused) bgmAudio.play().catch(()=>{});
}

function playSound(name) {
    if (!audioEnabled) return;
    initAudio();
    const a = new Audio(soundUrls[name]);
    a.volume = 0.65;
    a.play().catch(()=>{});
}

function toggleAudio() {
    audioEnabled = !audioEnabled;
    const btn = document.getElementById("audio-btn");
    if (audioEnabled) {
        btn.innerText = "🔊 音效/BGM: 开";
        bgmAudio.play().catch(()=>{});
    } else {
        btn.innerText = "🔇 音效/BGM: 关";
        bgmAudio.pause();
    }
}

// Sprites & Image Assets
const images = {};
const imageUrls = {
    bg: "assets/textures/cyber_bg.png",
    player_sheet: "assets/textures/player_sheet.png",
    player: "assets/textures/player.png",
    boss: "assets/textures/boss.png",
    drone: "assets/textures/drone.png",
    turret: "assets/textures/turret.png",
    bullet: "assets/textures/bullet.png",
    player_bullet: "assets/textures/player_bullet.png",
    core: "assets/textures/core.png",
    portal: "assets/textures/portal.png",
    jump_pad: "assets/textures/jump_pad.png",
    spikes: "assets/textures/tile_spikes.png",
    blade_pickup: "assets/textures/weapon_blade_pickup.png",
    blaster_pickup: "assets/textures/weapon_blaster_pickup.png",
    slash_fx: "assets/textures/slash_fx.png"
};

for (const [key, url] of Object.entries(imageUrls)) {
    const img = new Image();
    img.src = url;
    images[key] = img;
}

// Input Handling
const keys = {};
window.addEventListener("keydown", (e) => {
    initAudio();
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;
    if (["Space", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
    if (e.key.toLowerCase() === 'r') restartStage();
});
window.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
    keys[e.code] = false;
});
window.addEventListener("mousedown", () => { initAudio(); keys["mouse_left"] = true; });
window.addEventListener("mouseup", () => { keys["mouse_left"] = false; });

function setupTouch(id, keyName) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); keys[keyName] = true; });
    el.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyName] = false; });
}
setupTouch("btn-left", "arrowleft");
setupTouch("btn-right", "arrowright");
setupTouch("btn-jump", "space");
setupTouch("btn-dash", "shift");
setupTouch("btn-attack", "j");

// Game States
let currentStage = 1;
let coresCollected = 0;
let totalCores = 3;
let stageTime = 0.0;
let gameState = "PLAYING";
let screenShake = 0.0;

// Player Physics Object
const player = {
    x: 120,
    y: 480,
    w: 24,
    h: 38,
    vx: 0,
    vy: 0,
    speed: 300,
    jumpVelocity: -520,
    doubleJumpVelocity: -460,
    gravity: 1250,
    facing: 1,
    canDoubleJump: true,
    coyoteTime: 0,
    isDashing: false,
    dashTimer: 0,
    dashCooldown: 0,
    maxHp: 3,
    hp: 3,
    invulnTimer: 0,
    weapon: "none",
    attackCooldown: 0,
    animFrame: 0,
    animTimer: 0,
    ghosts: [],
    touchingWall: 0
};

// Particles Pool
let particles = [];
function addParticle(x, y, vx, vy, color, life = 0.35, size = 3) {
    particles.push({ x, y, vx, vy, color, life, maxLife: life, size });
}

// Projectiles & Entities
let slashes = [];
let playerBullets = [];
let enemyBullets = [];
let platforms = [];
let hazards = [];
let jumpPads = [];
let cores = [];
let enemies = [];
let weapons = [];
let portal = { x: 2180, y: 430, w: 50, h: 80, unlocked: false };
let boss = null;

// Stage Setup
function loadStage(num) {
    currentStage = num;
    coresCollected = 0;
    particles = [];
    slashes = [];
    playerBullets = [];
    enemyBullets = [];
    portal.unlocked = false;
    gameState = "PLAYING";
    player.vx = 0;
    player.vy = 0;
    player.canDoubleJump = true;

    if (num === 1) {
        player.x = 100;
        player.y = 480;
        totalCores = 3;
        portal.x = 2180;
        portal.y = 430;
        platforms = [
            { x: 40, y: 560, w: 320, h: 50 },
            { x: 480, y: 520, w: 260, h: 40 },
            { x: 780, y: 160, w: 60, h: 420 },
            { x: 920, y: 160, w: 60, h: 420 },
            { x: 980, y: 340, w: 260, h: 30 },
            { x: 1360, y: 260, w: 200, h: 30 },
            { x: 1620, y: 380, w: 180, h: 30 },
            { x: 1880, y: 500, w: 420, h: 60 }
        ];
        hazards = [
            { x: 360, y: 640, w: 120, h: 40, type: "spikes" },
            { x: 1240, y: 640, w: 280, h: 40, type: "spikes" }
        ];
        jumpPads = [
            { x: 1200, y: 324, w: 52, h: 16 }
        ];
        cores = [
            { x: 580, y: 460, collected: false },
            { x: 880, y: 200, collected: false },
            { x: 1710, y: 320, collected: false }
        ];
        weapons = [
            { x: 260, y: 510, type: "blade", picked: false }
        ];
        enemies = [
            { x: 600, y: 470, w: 38, h: 38, vx: 70, minX: 520, maxX: 680, type: "drone", hp: 1 },
            { x: 1460, y: 210, w: 38, h: 38, vx: 80, minX: 1380, maxX: 1540, type: "drone", hp: 1 }
        ];
        boss = null;
    } else if (num === 2) {
        player.x = 80;
        player.y = 480;
        totalCores = 3;
        portal.x = 2160;
        portal.y = 450;
        platforms = [
            { x: 40, y: 560, w: 280, h: 50 },
            { x: 420, y: 500, w: 220, h: 40 },
            { x: 780, y: 440, w: 160, h: 30 },
            { x: 1020, y: 360, w: 160, h: 30 },
            { x: 1260, y: 280, w: 160, h: 30 },
            { x: 1540, y: 400, w: 180, h: 30 },
            { x: 1840, y: 520, w: 440, h: 60 }
        ];
        hazards = [
            { x: 320, y: 640, w: 200, h: 40, type: "spikes" },
            { x: 1400, y: 640, w: 280, h: 40, type: "spikes" },
            { x: 350, y: 440, w: 14, h: 120, type: "laser", timer: 0 },
            { x: 1180, y: 240, w: 14, h: 120, type: "laser", timer: 0.8 }
        ];
        jumpPads = [
            { x: 900, y: 424, w: 52, h: 16 },
            { x: 1680, y: 384, w: 52, h: 16 }
        ];
        cores = [
            { x: 530, y: 440, collected: false },
            { x: 1100, y: 300, collected: false },
            { x: 1630, y: 340, collected: false }
        ];
        weapons = [
            { x: 220, y: 510, type: "blaster", picked: false }
        ];
        enemies = [
            { x: 860, y: 390, w: 38, h: 38, vx: 80, minX: 790, maxX: 930, type: "drone", hp: 1 },
            { x: 530, y: 240, w: 42, h: 32, type: "turret", hp: 2, shootTimer: 1.0 },
            { x: 1340, y: 120, w: 42, h: 32, type: "turret", hp: 2, shootTimer: 1.5 }
        ];
        boss = null;
    } else if (num === 3) {
        player.x = 180;
        player.y = 590;
        totalCores = 0;
        platforms = [
            { x: 0, y: 660, w: 1280, h: 60 },
            { x: 100, y: 460, w: 220, h: 30 },
            { x: 960, y: 460, w: 220, h: 30 },
            { x: 490, y: 320, w: 300, h: 30 }
        ];
        hazards = [];
        jumpPads = [
            { x: 60, y: 644, w: 52, h: 16 },
            { x: 1220, y: 644, w: 52, h: 16 }
        ];
        cores = [];
        weapons = [
            { x: 210, y: 410, type: "blade", picked: false },
            { x: 1070, y: 410, type: "blaster", picked: false }
        ];
        enemies = [];
        boss = {
            x: 640,
            y: 200,
            targetX: 640,
            targetY: 200,
            moveTimer: 0,
            w: 100,
            h: 100,
            hp: 100,
            maxHp: 100,
            attackTimer: 0,
            invulnTimer: 0
        };
    }
}

function restartStage() {
    player.hp = player.maxHp;
    loadStage(currentStage);
}

// Fixed-Step Physics Loop to Prevent Tunneling / Dropping Through Floors
let accumulator = 0;
const FIXED_DT = 1 / 60;
let lastTimestamp = performance.now();

function gameLoop(timestamp) {
    const elapsed = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
    lastTimestamp = timestamp;
    accumulator += elapsed;

    while (accumulator >= FIXED_DT) {
        if (gameState === "PLAYING") {
            fixedUpdate(FIXED_DT);
        }
        accumulator -= FIXED_DT;
    }

    render();
    requestAnimationFrame(gameLoop);
}

function fixedUpdate(dt) {
    stageTime += dt;
    if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 18);

    updatePlayerPhysics(dt);
    updateSlashes(dt);
    updateBullets(dt);
    updateEnemies(dt);
    if (boss) updateBoss(dt);
    updateParticles(dt);
    checkTriggers();
}

/**
 * Bulletproof Axis-Separated Collision Resolution
 */
function updatePlayerPhysics(dt) {
    if (player.invulnTimer > 0) player.invulnTimer -= dt;
    if (player.attackCooldown > 0) player.attackCooldown -= dt;
    if (player.dashCooldown > 0) player.dashCooldown -= dt;

    // Horizontal Movement Input
    let moveDir = 0;
    if (keys["a"] || keys["arrowleft"]) moveDir -= 1;
    if (keys["d"] || keys["arrowright"]) moveDir += 1;

    if (moveDir !== 0) {
        player.facing = moveDir;
        player.vx = moveDir * player.speed;
        player.animTimer += dt * 10;
        player.animFrame = Math.floor(player.animTimer) % 2 + 1; // Run1 / Run2
    } else {
        player.vx *= 0.72;
        player.animFrame = 0; // Idle
    }

    // Dash Execution
    if ((keys["shift"] || keys["k"]) && player.dashCooldown <= 0) {
        player.isDashing = true;
        player.dashTimer = 0.16;
        player.dashCooldown = 0.75;
        playSound("dash");
        screenShake = 3.0;
    }

    if (player.isDashing) {
        player.dashTimer -= dt;
        player.vx = player.facing * 780;
        player.vy = 0;
        player.animFrame = 5; // Dash frame
        player.ghosts.push({ x: player.x, y: player.y, facing: player.facing, life: 0.22 });
        if (player.dashTimer <= 0) player.isDashing = false;
    } else {
        // Apply Gravity
        player.vy += player.gravity * dt;
        // Cap terminal velocity
        player.vy = Math.min(player.vy, 900);
    }

    // --- STEP 1: X-AXIS MOVEMENT & WALL COLLISION ---
    player.x += player.vx * dt;
    player.touchingWall = 0;

    for (const p of platforms) {
        if (boxOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
            if (player.vx > 0) {
                player.x = p.x - player.w;
                player.touchingWall = 1;
            } else if (player.vx < 0) {
                player.x = p.x + p.w;
                player.touchingWall = -1;
            }
            player.vx = 0;
        }
    }

    // --- STEP 2: Y-AXIS MOVEMENT & FLOOR/CEILING COLLISION ---
    player.y += player.vy * dt;
    let onFloor = false;

    for (const p of platforms) {
        if (boxOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
            if (player.vy > 0) { // Landing on platform
                player.y = p.y - player.h;
                player.vy = 0;
                onFloor = true;
                player.canDoubleJump = true;
                player.coyoteTime = 0.12;
            } else if (player.vy < 0) { // Hitting ceiling
                player.y = p.y + p.h;
                player.vy = 0;
            }
        }
    }

    if (!onFloor) {
        player.coyoteTime -= dt;
        // Wall Slide
        if (player.touchingWall !== 0 && player.vy > 0) {
            player.vy = Math.min(player.vy, 100);
            player.canDoubleJump = true;
        }
        // Jump / Fall animation frames
        player.animFrame = player.vy < 0 ? 3 : 4;
    }

    // Jump Input
    const jumpPressed = keys[" "] || keys["space"] || keys["w"] || keys["arrowup"];
    if (jumpPressed && !player.jumpPrevPressed) {
        if (player.coyoteTime > 0) {
            player.vy = player.jumpVelocity;
            player.coyoteTime = 0;
            playSound("jump");
            for (let i = 0; i < 8; i++) addParticle(player.x + 12, player.y + player.h, (Math.random() - 0.5) * 80, 20, "#00f0ff");
        } else if (player.touchingWall !== 0) {
            // Wall Jump
            player.vx = -player.touchingWall * 360;
            player.vy = player.jumpVelocity * 0.95;
            player.facing = -player.touchingWall;
            playSound("jump");
            for (let i = 0; i < 10; i++) addParticle(player.x + 12, player.y + 20, player.facing * 50, -20, "#00f0ff");
        } else if (player.canDoubleJump) {
            player.vy = player.doubleJumpVelocity;
            player.canDoubleJump = false;
            playSound("jump");
            for (let i = 0; i < 14; i++) addParticle(player.x + 12, player.y + player.h, (Math.random() - 0.5) * 140, (Math.random() - 0.5) * 60, "#00f0ff");
        }
    }
    player.jumpPrevPressed = jumpPressed;

    // Weapon Attack
    const attackPressed = keys["j"] || keys["x"] || keys["mouse_left"];
    if (attackPressed && player.attackCooldown <= 0 && player.weapon !== "none") {
        if (player.weapon === "blade") {
            player.attackCooldown = 0.28;
            playSound("slash");
            slashes.push({
                x: player.x + (player.facing > 0 ? 16 : -48),
                y: player.y - 8,
                w: 56,
                h: 56,
                facing: player.facing,
                life: 0.14
            });
            player.vx += player.facing * 80;
        } else if (player.weapon === "blaster") {
            player.attackCooldown = 0.2;
            playSound("shoot");
            playerBullets.push({
                x: player.x + (player.facing > 0 ? 26 : -14),
                y: player.y + 16,
                vx: player.facing * 760,
                life: 2.0
            });
            player.vx -= player.facing * 35;
        }
    }

    // Ghost Trails update
    for (let i = player.ghosts.length - 1; i >= 0; i--) {
        player.ghosts[i].life -= dt;
        if (player.ghosts[i].life <= 0) player.ghosts.splice(i, 1);
    }

    // Pit fall check
    if (player.y > 760) takeDamage(3);
}

function takeDamage(amt) {
    if (player.invulnTimer > 0) return;
    player.hp -= amt;
    player.invulnTimer = 1.2;
    playSound("hit");
    screenShake = 6.0;
    player.vy = -320;
    player.vx = -player.facing * 220;
    if (player.hp <= 0) {
        gameState = "GAMEOVER";
    }
}

function boxOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
}

function updateSlashes(dt) {
    for (let i = slashes.length - 1; i >= 0; i--) {
        const s = slashes[i];
        s.life -= dt;
        for (let e of enemies) {
            if (boxOverlap(s.x, s.y, s.w, s.h, e.x, e.y, e.w, e.h)) {
                e.hp -= 2;
                playSound("hit");
                screenShake = 4.0;
                for (let p = 0; p < 12; p++) addParticle(e.x + e.w/2, e.y + e.h/2, (Math.random()-0.5)*180, (Math.random()-0.5)*180, "#ff0055");
            }
        }
        if (boss && boxOverlap(s.x, s.y, s.w, s.h, boss.x - boss.w/2, boss.y - boss.h/2, boss.w, boss.h)) {
            if (boss.invulnTimer <= 0) {
                boss.hp -= 15;
                boss.invulnTimer = 0.6;
                playSound("hit");
                screenShake = 5.0;
                for (let p = 0; p < 18; p++) addParticle(boss.x, boss.y, (Math.random()-0.5)*220, (Math.random()-0.5)*220, "#ff0055");
            }
        }
        for (let b of enemyBullets) {
            if (boxOverlap(s.x, s.y, s.w, s.h, b.x - 10, b.y - 10, 20, 20)) {
                b.vx = s.facing * 640;
                b.vy = (Math.random() - 0.5) * 80;
                b.isPlayer = true;
                playSound("parry");
                for (let p = 0; p < 10; p++) addParticle(b.x, b.y, (Math.random()-0.5)*120, (Math.random()-0.5)*120, "#00f0ff");
            }
        }
        if (s.life <= 0) slashes.splice(i, 1);
    }
}

function updateBullets(dt) {
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.x += b.vx * dt;
        b.life -= dt;
        for (let e of enemies) {
            if (boxOverlap(b.x - 12, b.y - 5, 24, 10, e.x, e.y, e.w, e.h)) {
                e.hp -= 1;
                b.life = 0;
                playSound("hit");
            }
        }
        if (boss && boxOverlap(b.x - 12, b.y - 5, 24, 10, boss.x - boss.w/2, boss.y - boss.h/2, boss.w, boss.h)) {
            boss.hp -= 4;
            b.life = 0;
            playSound("hit");
        }
        if (b.life <= 0) playerBullets.splice(i, 1);
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (!b.isPlayer) {
            if (boxOverlap(b.x - 8, b.y - 8, 16, 16, player.x, player.y, player.w, player.h)) {
                takeDamage(1);
                enemyBullets.splice(i, 1);
                continue;
            }
        } else {
            for (let e of enemies) {
                if (boxOverlap(b.x - 8, b.y - 8, 16, 16, e.x, e.y, e.w, e.h)) {
                    e.hp -= 2;
                    enemyBullets.splice(i, 1);
                    break;
                }
            }
            if (boss && boxOverlap(b.x - 8, b.y - 8, 16, 16, boss.x - boss.w/2, boss.y - boss.h/2, boss.w, boss.h)) {
                boss.hp -= 10;
                enemyBullets.splice(i, 1);
            }
        }
        if (b.x < 0 || b.x > 2600 || b.y < 0 || b.y > 800) enemyBullets.splice(i, 1);
    }
}

function updateEnemies(dt) {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.hp <= 0) {
            playSound("stomp");
            screenShake = 4.0;
            for (let p = 0; p < 18; p++) addParticle(e.x + e.w/2, e.y + e.h/2, (Math.random()-0.5)*180, (Math.random()-0.5)*180, "#ff0055");
            enemies.splice(i, 1);
            continue;
        }

        if (e.type === "drone") {
            e.x += e.vx * dt;
            if (e.x < e.minX || e.x > e.maxX) e.vx = -e.vx;
            // Stomp check
            if (player.vy > 0 && boxOverlap(player.x, player.y + player.h - 10, player.w, 14, e.x, e.y, e.w, 14)) {
                player.vy = player.jumpVelocity * 0.9;
                player.canDoubleJump = true;
                e.hp = 0;
                playSound("stomp");
                screenShake = 3.5;
            } else if (boxOverlap(player.x, player.y, player.w, player.h, e.x, e.y, e.w, e.h)) {
                takeDamage(1);
            }
        } else if (e.type === "turret") {
            e.shootTimer -= dt;
            if (e.shootTimer <= 0) {
                e.shootTimer = 2.0;
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                enemyBullets.push({
                    x: e.x + e.w/2,
                    y: e.y + e.h/2,
                    vx: Math.cos(angle) * 320,
                    vy: Math.sin(angle) * 320,
                    isPlayer: false
                });
                playSound("shoot");
            }
        }
    }
}

function updateBoss(dt) {
    if (boss.hp <= 0) {
        playSound("portal");
        gameState = "VICTORY";
        return;
    }
    if (boss.invulnTimer > 0) boss.invulnTimer -= dt;

    boss.moveTimer += dt;
    if (boss.moveTimer >= 2.4) {
        boss.moveTimer = 0;
        boss.targetX = 280 + Math.random() * 720;
        boss.targetY = 160 + Math.random() * 200;
    }
    boss.x += (boss.targetX - boss.x) * dt * 2.2;
    boss.y += (boss.targetY - boss.y) * dt * 2.2;

    boss.attackTimer += dt;
    const rate = boss.hp > 65 ? 2.0 : (boss.hp > 30 ? 1.4 : 0.85);
    if (boss.attackTimer >= rate) {
        boss.attackTimer = 0;
        const count = boss.hp > 65 ? 5 : (boss.hp > 30 ? 8 : 12);
        const baseAngle = Math.atan2(player.y - boss.y, player.x - boss.x);
        for (let i = 0; i < count; i++) {
            const angle = baseAngle + (i - count/2) * 0.24;
            enemyBullets.push({
                x: boss.x,
                y: boss.y,
                vx: Math.cos(angle) * 270,
                vy: Math.sin(angle) * 270,
                isPlayer: false
            });
        }
        playSound("shoot");
    }

    if (player.vy > 0 && boxOverlap(player.x, player.y + player.h - 12, player.w, 16, boss.x - boss.w/2, boss.y - boss.h/2, boss.w, 24)) {
        player.vy = player.jumpVelocity * 0.9;
        boss.hp -= 20;
        playSound("stomp");
        screenShake = 6.0;
        for (let p = 0; p < 20; p++) addParticle(boss.x, boss.y, (Math.random()-0.5)*220, (Math.random()-0.5)*220, "#ff0055");
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function checkTriggers() {
    for (let pad of jumpPads) {
        if (boxOverlap(player.x, player.y + player.h - 8, player.w, 10, pad.x, pad.y, pad.w, pad.h)) {
            player.vy = -740;
            player.canDoubleJump = true;
            playSound("jump");
            for (let i = 0; i < 10; i++) addParticle(pad.x + pad.w/2, pad.y, (Math.random()-0.5)*100, -50, "#39ff14");
        }
    }

    for (let h of hazards) {
        if (h.type === "spikes") {
            if (boxOverlap(player.x, player.y + player.h - 6, player.w, 10, h.x, h.y, h.w, h.h)) {
                takeDamage(1);
            }
        } else if (h.type === "laser") {
            h.timer = (h.timer + FIXED_DT) % 3.0;
            if (h.timer < 1.6 && boxOverlap(player.x, player.y, player.w, player.h, h.x, h.y, h.w, h.h)) {
                takeDamage(1);
            }
        }
    }

    for (let c of cores) {
        if (!c.collected && boxOverlap(player.x, player.y, player.w, player.h, c.x - 20, c.y - 20, 40, 40)) {
            c.collected = true;
            coresCollected++;
            playSound("collect");
            for (let p = 0; p < 16; p++) addParticle(c.x, c.y, (Math.random()-0.5)*140, (Math.random()-0.5)*140, "#ffe600");
            if (coresCollected >= totalCores) portal.unlocked = true;
        }
    }

    for (let w of weapons) {
        if (!w.picked && boxOverlap(player.x, player.y, player.w, player.h, w.x - 24, w.y - 24, 48, 48)) {
            w.picked = true;
            player.weapon = w.type;
            playSound("weapon_pickup");
            for (let p = 0; p < 20; p++) addParticle(w.x, w.y, (Math.random()-0.5)*160, (Math.random()-0.5)*160, "#00f0ff");
        }
    }

    if (portal.unlocked && boxOverlap(player.x, player.y, player.w, player.h, portal.x - 24, portal.y - 40, 48, 80)) {
        playSound("portal");
        if (currentStage < 3) loadStage(currentStage + 1);
        else gameState = "VICTORY";
    }
}

// Render Engine with Multi-Frame Animation & Neon Shadow Glow
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let shakeX = (Math.random() - 0.5) * screenShake;
    let shakeY = (Math.random() - 0.5) * screenShake;

    let camX = 0;
    if (currentStage < 3) {
        camX = Math.max(0, Math.min(player.x - 420, 1100));
    }

    ctx.save();
    ctx.translate(-camX + shakeX, shakeY);

    // Parallax Background
    if (images.bg && images.bg.complete) {
        ctx.drawImage(images.bg, 0, 0, 1280, 720);
        if (currentStage < 3) ctx.drawImage(images.bg, 1280, 0, 1280, 720);
    }

    // High-Tech Cyber Platforms
    for (let p of platforms) {
        // Platform Core Body
        ctx.fillStyle = "#0c0a1f";
        ctx.fillRect(p.x, p.y, p.w, p.h);
        
        // Neon Border Top with Glow
        ctx.save();
        ctx.shadowColor = currentStage === 3 && p.y > 600 ? "#ff0055" : "#00f0ff";
        ctx.shadowBlur = 12;
        ctx.fillStyle = currentStage === 3 && p.y > 600 ? "#ff0055" : "#00f0ff";
        ctx.fillRect(p.x, p.y, p.w, 3);
        ctx.restore();

        // Subtle circuit lines
        ctx.fillStyle = "rgba(0, 240, 255, 0.15)";
        ctx.fillRect(p.x + p.w * 0.1, p.y + 8, p.w * 0.8, 2);
    }

    // Hazards
    for (let h of hazards) {
        if (h.type === "spikes") {
            const count = Math.floor(h.w / 64);
            for (let i = 0; i < count; i++) {
                ctx.drawImage(images.spikes, h.x + i * 64, h.y, 64, 48);
            }
        } else if (h.type === "laser") {
            ctx.save();
            if (h.timer < 1.6) {
                ctx.shadowColor = "#ff0055";
                ctx.shadowBlur = 18;
                ctx.fillStyle = "rgba(255, 0, 85, 0.9)";
                ctx.fillRect(h.x, h.y, h.w, h.h);
            } else {
                ctx.fillStyle = "rgba(255, 0, 85, 0.12)";
                ctx.fillRect(h.x, h.y, h.w, h.h);
            }
            ctx.restore();
        }
    }

    // Jump Pads
    for (let pad of jumpPads) {
        ctx.save();
        ctx.shadowColor = "#39ff14";
        ctx.shadowBlur = 10;
        ctx.drawImage(images.jump_pad, pad.x, pad.y, pad.w, pad.h);
        ctx.restore();
    }

    // Weapons
    for (let w of weapons) {
        if (!w.picked) {
            const img = w.type === "blade" ? images.blade_pickup : images.blaster_pickup;
            const floatY = w.y - 20 + Math.sin(stageTime * 4.5) * 4;
            ctx.save();
            ctx.shadowColor = w.type === "blade" ? "#00f0ff" : "#39ff14";
            ctx.shadowBlur = 12;
            ctx.drawImage(img, w.x - 22, floatY, 44, 44);
            ctx.restore();
        }
    }

    // Cores
    for (let c of cores) {
        if (!c.collected) {
            const floatY = c.y - 20 + Math.sin(stageTime * 4.5) * 5;
            ctx.save();
            ctx.shadowColor = "#ffe600";
            ctx.shadowBlur = 15;
            ctx.drawImage(images.core, c.x - 20, floatY, 40, 40);
            ctx.restore();
        }
    }

    // Portal
    if (currentStage < 3) {
        ctx.save();
        ctx.globalAlpha = portal.unlocked ? 1.0 : 0.45;
        if (portal.unlocked) {
            ctx.shadowColor = "#b026ff";
            ctx.shadowBlur = 20;
        }
        ctx.drawImage(images.portal, portal.x - 30, portal.y - 45, 60, 90);
        ctx.restore();
    }

    // Enemies
    for (let e of enemies) {
        ctx.save();
        ctx.shadowColor = "#ff0055";
        ctx.shadowBlur = 10;
        if (e.type === "drone") {
            ctx.drawImage(images.drone, e.x, e.y, e.w, e.h);
        } else if (e.type === "turret") {
            ctx.drawImage(images.turret, e.x, e.y, e.w, e.h);
        }
        ctx.restore();
    }

    // Boss Overlord
    if (boss) {
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(Math.sin(stageTime * 3) * 0.1);
        ctx.shadowColor = "#ff0055";
        ctx.shadowBlur = 22;
        if (boss.invulnTimer > 0 && Math.floor(stageTime * 20) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }
        ctx.drawImage(images.boss, -boss.w/2, -boss.h/2, boss.w, boss.h);
        ctx.restore();

        // Boss HP Bar
        ctx.fillStyle = "#150d24";
        ctx.fillRect(boss.x - 130, boss.y - 75, 260, 14);
        ctx.fillStyle = "#ff0055";
        ctx.fillRect(boss.x - 130, boss.y - 75, (boss.hp / boss.maxHp) * 260, 14);
        ctx.strokeStyle = "#00f0ff";
        ctx.strokeRect(boss.x - 130, boss.y - 75, 260, 14);
    }

    // Slashes
    for (let s of slashes) {
        ctx.save();
        ctx.translate(s.x + s.w/2, s.y + s.h/2);
        if (s.facing < 0) ctx.scale(-1, 1);
        ctx.shadowColor = "#00f0ff";
        ctx.shadowBlur = 16;
        ctx.drawImage(images.slash_fx, -s.w/2, -s.h/2, s.w, s.h);
        ctx.restore();
    }

    // Bullets
    for (let b of playerBullets) {
        ctx.save();
        ctx.shadowColor = "#00f0ff";
        ctx.shadowBlur = 12;
        ctx.drawImage(images.player_bullet, b.x - 14, b.y - 6, 28, 12);
        ctx.restore();
    }
    for (let b of enemyBullets) {
        ctx.save();
        ctx.shadowColor = b.isPlayer ? "#00f0ff" : "#ff0055";
        ctx.shadowBlur = 10;
        ctx.drawImage(images.bullet, b.x - 10, b.y - 10, 20, 20);
        ctx.restore();
    }

    // Ghost Trails
    for (let g of player.ghosts) {
        ctx.save();
        ctx.globalAlpha = (g.life / 0.22) * 0.45;
        ctx.translate(g.x + player.w/2, g.y + player.h/2);
        if (g.facing < 0) ctx.scale(-1, 1);
        // Draw dash frame from sheet
        if (images.player_sheet && images.player_sheet.complete) {
            ctx.drawImage(images.player_sheet, 5 * 48, 0, 48, 48, -24, -24, 48, 48);
        } else {
            ctx.drawImage(images.player, -player.w/2, -player.h/2, player.w, player.h);
        }
        ctx.restore();
    }

    // Player with SpriteSheet Animation
    if (player.invulnTimer <= 0 || Math.floor(stageTime * 18) % 2 === 0) {
        ctx.save();
        ctx.translate(player.x + player.w/2, player.y + player.h/2);
        if (player.facing < 0) ctx.scale(-1, 1);
        ctx.shadowColor = "#00f0ff";
        ctx.shadowBlur = 14;

        if (images.player_sheet && images.player_sheet.complete) {
            ctx.drawImage(images.player_sheet, player.animFrame * 48, 0, 48, 48, -24, -24, 48, 48);
        } else {
            ctx.drawImage(images.player, -player.w/2, -player.h/2, player.w, player.h);
        }

        // Weapon on back/hand
        if (player.weapon === "blade") {
            ctx.drawImage(images.blade_pickup, -8, -10, 22, 22);
        } else if (player.weapon === "blaster") {
            ctx.drawImage(images.blaster_pickup, -8, -6, 20, 20);
        }
        ctx.restore();
    }

    // Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1.0;

    ctx.restore();

    // Render Cyber HUD
    renderHUD();

    // Overlays
    if (gameState === "GAMEOVER") {
        ctx.fillStyle = "rgba(8, 5, 18, 0.88)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.shadowColor = "#ff0055";
        ctx.shadowBlur = 20;
        ctx.fillStyle = "#ff0055";
        ctx.font = "bold 38px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.fillText("PROTOCOL TERMINATED", canvas.width / 2, canvas.height / 2 - 30);
        ctx.restore();

        ctx.fillStyle = "#00f0ff";
        ctx.font = "20px 'Courier New', monospace";
        ctx.fillText("按 [R] 重新加载关卡协议", canvas.width / 2, canvas.height / 2 + 25);
    } else if (gameState === "VICTORY") {
        ctx.fillStyle = "rgba(8, 5, 18, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.shadowColor = "#00f0ff";
        ctx.shadowBlur = 24;
        ctx.fillStyle = "#00f0ff";
        ctx.font = "bold 42px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.fillText("★ PROTOCOL COMPLETED ★", canvas.width / 2, canvas.height / 2 - 40);
        ctx.restore();

        ctx.fillStyle = "#ffe600";
        ctx.font = "22px 'Courier New', monospace";
        ctx.fillText("恭喜通关！所有数据矩阵已破译！", canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillStyle = "#fff";
        ctx.font = "18px 'Courier New', monospace";
        ctx.fillText("通关用时: " + formatTime(stageTime) + " | 按 [R] 重新挑战", canvas.width / 2, canvas.height / 2 + 55);
    }
}

function renderHUD() {
    let x = 20, y = 20;
    ctx.fillStyle = "rgba(10, 8, 24, 0.85)";
    ctx.fillRect(x - 6, y - 6, 500, 36);
    ctx.strokeStyle = "#00f0ff";
    ctx.strokeRect(x - 6, y - 6, 500, 36);

    ctx.fillStyle = "#00f0ff";
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillText("SHIELD:", x, y + 18);
    for (let i = 0; i < player.maxHp; i++) {
        ctx.fillStyle = i < player.hp ? "#00f0ff" : "#252535";
        ctx.fillRect(x + 70 + i * 26, y + 6, 20, 14);
    }

    const wName = player.weapon === "blade" ? "⚔️ 光刃[J]" : (player.weapon === "blaster" ? "🔫 爆能枪[J]" : "空手");
    ctx.fillStyle = "#00f0ff";
    ctx.fillText("WEAPON: " + wName, x + 160, y + 18);

    ctx.fillStyle = currentStage === 3 ? "#ff0055" : "#ffe600";
    const targetText = currentStage === 3 ? "TARGET: OVERLORD" : `CORES: ${coresCollected}/${totalCores}`;
    ctx.fillText(targetText, x + 340, y + 18);

    ctx.fillStyle = "rgba(10, 8, 24, 0.85)";
    ctx.fillRect(canvas.width - 240, 14, 220, 36);
    ctx.strokeRect(canvas.width - 240, 14, 220, 36);
    ctx.fillStyle = "#00f0ff";
    ctx.textAlign = "right";
    ctx.fillText(`STAGE 0${currentStage} | ${formatTime(stageTime)}`, canvas.width - 35, 38);
    ctx.textAlign = "left";
}

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    const ms = Math.floor((sec % 1) * 100);
    return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}.${ms < 10 ? '0' : ''}${ms}`;
}

// Start Game Loop
loadStage(1);
requestAnimationFrame(gameLoop);
</script>
